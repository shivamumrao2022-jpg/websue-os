name: Build Websue OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Websue ISO
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -lc '
              pacman -Syu --noconfirm archiso
              mkarchiso -v \
                -w /tmp/websue-work \
                -o /workspace/out \
                /workspace/profile
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: websue-os-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 7
